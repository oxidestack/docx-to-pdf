<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig 2.15's 45-latin.conf makes "Segoe UI" (and other UI families) default to the generic
     system-ui, and its 60-latin.conf prefers Cantarell for system-ui. The image carries upstream's
     Cantarell-ExtraBold.otf, so Segoe UI became Cantarell Extra Bold. fontconfig 2.13 (moalhaddar/docx-to-pdf's)
     has no system-ui generic: Segoe UI fell to sans-serif, DejaVu Sans (fc-match in its image). Prefer DejaVu Sans for
     system-ui before 60-latin.conf runs, as local.conf does for the other generics. -->
<fontconfig>
  <alias><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
