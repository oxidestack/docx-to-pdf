<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- LibreOffice 24.8+ appends a strong "serif" or "sans" after the requested family when the document's
     font family type is roman or swiss (core 6dfac38bac, tdf#162072); 7.3 (the oracle) did not. Delete
     that appended value before any other rule runs, so the query is 7.3's. A request whose first family
     is the generic itself is left alone. -->
<fontconfig>
  <match target="pattern">
    <test qual="not_first" name="family" compare="eq"><string>serif</string></test>
    <test qual="first" name="family" compare="not_eq"><string>serif</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="pattern">
    <test qual="not_first" name="family" compare="eq"><string>sans</string></test>
    <test qual="first" name="family" compare="not_eq"><string>sans</string></test>
    <edit name="family" mode="delete"/>
  </match>
</fontconfig>
