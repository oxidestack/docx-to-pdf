apiVersion: v2
name: docx-to-pdf
description: An HTTP service that converts DOCX, DOC, ODT and RTF documents to PDF with LibreOffice.
type: application
# The chart's own version; appVersion is the image tag it installs by default (the release sets both from its tag).
version: 1.1.0
appVersion: "1.1.0"
# 1.30: the preStop sleep action (preStopSleepSeconds).
kubeVersion: ">=1.30.0-0"
keywords: [docx, pdf, libreoffice, converter]
home: https://github.com/oxidestack/docx-to-pdf
sources:
  - https://github.com/oxidestack/docx-to-pdf
maintainers:
  # `name` is a GitHub account: chart-testing checks it (tools/lint/ct.yaml).
  - name: kustov-vitalik
    email: kustov.vitalik@gmail.com
# Artifact Hub's annotations. The release adds the three that name its version to the packaged copy
# (tools/ci/release.sh chart): `artifacthub.io/images` (the image at that tag, which Artifact Hub scans),
# `artifacthub.io/prerelease`, and `artifacthub.io/changes`, written from the version's section of CHANGELOG.md.
annotations:
  # The chart's licence, the code's: Artifact Hub shows it.
  artifacthub.io/license: Apache-2.0
  # One of Artifact Hub's fixed categories; without it a model guesses one from the name and keywords.
  artifacthub.io/category: data-processing
  # `support` is the name Artifact Hub highlights as the place to report an issue.
  artifacthub.io/links: |
    - name: Documentation
      url: https://oxidestack.github.io/docx-to-pdf/
    - name: Benchmarks
      url: https://oxidestack.github.io/docx-to-pdf/benchmarks/
    - name: support
      url: https://github.com/oxidestack/docx-to-pdf/issues
    - name: Image
      url: https://quay.io/repository/oxidestack/docx-to-pdf
    - name: Verifying a release
      url: https://github.com/oxidestack/docx-to-pdf/blob/main/docs/guide/installation.md#verifying-a-release
