# CodeQL, GitHub's code scanning: the Rust of the service and fuzz/, the Python of tools/, the JavaScript of site/ and
# these workflows, each analysed from source (`build-mode: none`, so nothing is compiled), its alerts on the
# repository's Security tab.
#
# On a push to `main`, on every pull request and weekly (a new query finds what an old commit already had). A branch's
# own push is checked by its pull request: alerts are tracked against `main`.
#
# Code scanning needs the repository public, or GitHub Code Security on a paid plan, so while the repository is
# private a push or a pull request starts no job (ci.yml's `if:`), and a scheduled run stops at `visibility` (one
# minute, billed), since a schedule's event carries no repository to read the visibility from. A manual run
# (`gh workflow run codeql.yml`) analyses at any time; while private it keeps the SARIF as the run's artifact instead
# of uploading it, which GitHub would refuse.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  visibility:
    # A schedule's event has no `repository`, so it is asked of the API: `public` is `true` or `false`.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read  # the repository's metadata, its visibility
    outputs:
      public: ${{ steps.ask.outputs.public }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: echo "public=$(gh api "repos/$REPO" --jq '.private | not')" >> "$GITHUB_OUTPUT"

  analyze:
    needs: [visibility]
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && needs.visibility.outputs.public == 'true')
      || (github.event_name != 'schedule' && !github.event.repository.private)) }}
    name: analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, javascript-typescript, actions]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read  # actions/checkout reads the repository
      security-events: write  # analyze uploads the SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: target/codeql
      - if: ${{ !cancelled() && github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: target/codeql/
          retention-days: 7
          if-no-files-found: warn
