# The documentation site (site/README.md) on GitHub Pages: a project page at
# https://oxidestack.github.io/docx-to-pdf/.
#
# A reusable workflow, not a pipeline of its own: GitHub's CI is one workflow, .github/workflows/ci.yml, one run per
# push, and that workflow calls this one as its `site` job, the twin of .gitriver/workflows/ci.yml's:
#
#   site:
#     uses: ./.github/workflows/site.yml
#     permissions:
#       contents: read
#       pages: write
#       id-token: write
#
# The caller grants the deploy job's permissions, since a called workflow can narrow its caller's and never widen
# them. `build` runs on every push and pull request: `make site` in the pinned node image, which checks the lockfile's
# licences and fails on a broken internal link or anchor; then the `helm repo add` repository is added to the build,
# /charts/index.yaml, indexing the chart attached to each GitHub release (tools/ci/release.sh index), so every deploy
# carries every release's chart. `deploy` publishes the build on a push to `main`, and on a release tag when
# .github/workflows/release.yml calls this after its GitHub release; only while the repository is public: GitHub Pages
# refuses a private repository of a Free organisation. It needs the repository's Settings → Pages → Source set to
# GitHub Actions, and the `github-pages` environment to admit the `v*` tags. Every action is pinned by commit.
name: site

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read  # actions/checkout reads the repository
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make site
      - name: the helm repository's index
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/ci/release.sh index site/dist/charts
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    if: >-
      github.event_name == 'push' && !github.event.repository.private &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # actions/checkout reads the repository
      pages: write  # tools/ci/deploy-pages.sh publishes the uploaded build to the repository's Pages site
      id-token: write  # tools/ci/deploy-pages.sh proves the run's identity to Pages with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and a running one is never cancelled half-way: the next push's waits for it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Not actions/deploy-pages: it names a deployment by the commit, and Pages keeps the first deployment of a
      # commit, so a release tag's build on a commit `main` already deployed was never published
      # (tools/ci/deploy-pages.sh says more).
      - id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build.outputs.artifact-id }}
        run: sh tools/ci/deploy-pages.sh "$ARTIFACT"
