body:
  - type: markdown
    attributes:
      value: >-
        A bug — a document that converts wrongly, an answer that is wrong — belongs in an
        [issue](https://github.com/oxidestack/docx-to-pdf/issues/new/choose).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or digest, if it matters to the question.
  - type: dropdown
    id: deployment
    attributes:
      label: How it runs
      options:
        - docker run
        - Docker Compose
        - Helm chart
        - Built from source
        - Not running it yet
        - Other
